{% extends 'base.html' %}

{% block content %}
<div style="margin-top: 1.5rem;">
    <h2>Network Clients</h2>
</div>
<hr>
<div class="container-fluid" style="padding-bottom: 48px;">
    <table id="data" class="table table-striped" style="width: 100%; font-size: 0.9rem;">
        <thead>
            <tr>
                <th>MAC Address</th>
                <th>IP Address</th>
                <th>Hostname</th>
                <th>Network</th>
                <th>Connected to</th>
                <th>Uptime</th>
                <th>Device assigned to</th>
                <th>Connected as</th>
                <th>Authentication Server</th>
                <th>Authentication Status</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</div>
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="refreshToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="5000">
        <div class="toast-header">
            <strong class="me-auto"><span id="toastTitle"></span></strong>
            <small id="toastTime"></small>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body">
            <span id="toastMessage"></span>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.datatables.net/plug-ins/2.2.2/sorting/absolute.js"></script>
<script>
const toast = new bootstrap.Toast(document.getElementById('refreshToast'));

function displayToast(title, message)
{
    var time = new Date().toLocaleTimeString();

    document.getElementById('toastTitle').textContent = title
    document.getElementById('toastTime').textContent = time;
    document.getElementById('toastMessage').textContent = message;

    toast.show();
}

var assigneeType = $.fn.dataTable.absoluteOrder([
    { value: "Unassigned", position: 'bottom' },
]);

var localUserType = $.fn.dataTable.absoluteOrder([
    { value: null, position: 'bottom' },
    { value: '', position: 'bottom' }
]);

$(document).ready(function () 
{
    var tbl = $('#data').DataTable(
    {
        ajax: '/api/omada/clients?format.uptime=true',
        stateSave: true,
        stateDuration: 360 * 24 * 3600,
        columns:
        [
            { data: 'mac' }, // 0
            { data: 'ip' }, // 1
            { data: 'hostName' }, // 2
            { data: 'connectedTo' }, // 3
            { data: 'connectionPort' }, // 4
            {
                data: 'uptime', // 5
                render: function(data, type, row)
                {
                    if (type === 'display' || type === 'filter')
                        return data.formatted;
                    
                    return data.raw;
                },
                searchable: false
            },
            { 
                data: 'assignee', // 6
                type: assigneeType
            },            
            {
                data: 'localUser', // 7
                type: localUserType,
                render: function(data, type, row)
                {
                    
                    // Check if localUser and asignee are the same, if not, color the localUser in red to indicate a mismatch
                    // Also display a tooltip on hover to indicate the mismatch. Plus an icon to indicate mismatch should be a warning triangle.
                    if (type === 'display' || type === 'filter')
                    {
                        if (data !== null && data !== '' && row.assignee !== null && row.assignee !== '')
                        {
                            if (row.assignee === 'Unassigned')
                            {
                                // BYOD or unassigned device, so we don't care about the mismatch but mark light blue to indicate that the device is unassigned
                                return `<span class="text-primary" data-bs-toggle="tooltip" title="BYOD or unassigned device"><small><i class="fa-solid fa-user-tag"></i></small> ${data}</span>`;
                            }
                            else
                            {
                                if (data.toLowerCase() === row.assignee.toLowerCase())
                                    return `<span class="text-success" data-bs-toggle="tooltip" title="Matches assigned device"><small><i class="fa-solid fa-user-check"></i></small> ${data}</span>`;
                                else 
                                    return `<span class="text-danger" data-bs-toggle="tooltip" title="Mismatch with assigned device: ${row.assignee}"><small><i class="fa-solid fa-user-xmark"></i></small> ${data}</span>`;
                            } 
                        }
                        else
                        {
                            return data;
                        }
                    }

                    return data;
                }
            },
            { data: 'authServer' }, // 8
            {
                data: 'authStatus', // 9
                render: function(data, type, row)
                {
                    if (type === 'display' || type === 'filter')
                    {
                        switch(data)
                        {
                            case 0:
                                return "Non-authorized"
                            case 1:
                                return "Pending"
                            case 2:
                                return "Authorized"
                            case 3:
                                return "Permanent Bypass"
                            default:
                                return "Unknown"
                        }
                    }

                    return data
                }
            }
        ],
        columnDefs:
        [
            {
                searchPanes: { show: true },
                targets: [3, 4, 8]
            },
            {
                searchPanes: { show: false },
                targets: [0, 1, 2, 5, 6, 7]
            },
            {
                visible: false,
                targets: [8, 9]
            }
        ],
        order: [[6, 'asc']],
        fixedHeader: true,
        language:
        {
            searchBuilder:
            {
                button:
                {
                    0: 'Advanced Search',
                    _: 'Advanced Search (%d)'
                },
                title:
                {
                    _: 'Advanced Search (%d)',
                    0: 'Advanced Search'
                },
                data: 'Item'
            }
        },
        pageLength: 25,
        lengthMenu: [[10, 25, 50, 100, -1], [10, 25, 50, 100, "All"]],
        layout:
        {
            top3End: 'search',
            top2Start: 'info',
            top2End: 
            {
                buttons: 
                [
                    {
                        extend: 'colvis',
                        text: 'Columns',
                        columns: ':not(:first-child)'
                    },
                    {
                        extend: 'collection',
                        text: 'Export…',
                        buttons:
                        [
                            {
                                extend: 'excelHtml5',
                                text: 'Excel',
                                autoFilter: true,
                                filename: `Kanri_Network_Clients_${new Date().toISOString().slice(0, 10)}`,
                                messageBottom: `Exported on ${new Date().toISOString().slice(0, 10)}. Generated by JACITA Kanri.`,
                                sheetName: 'Network Clients',
                                exportOptions: { columns: [0, 1, 2, 3, 4, 5, 6, 7] }
                            },
                            {
                                extend: 'pdfHtml5',
                                text: 'PDF',
                                filename: `Kanri_Network_Clients_${new Date().toISOString().slice(0, 10)}`,
                                download: 'open',
                                messageBottom: `Exported on ${new Date().toISOString().slice(0, 10)}. Generated by JACITA Kanri.`,
                                pageSize: 'A4',
                                orientation: 'landscape',
                                exportOptions: { columns: [0, 1, 2, 3, 4, 5, 6, 7] }
                            }
                        ]
                    },
                    {
                        extend: 'searchBuilder',
                        config: 
                        {
                            columns:
                            {
                                0: { type: 'string' },
                                1: { type: 'string' },
                                2: { type: 'string' },
                                3: { type: 'string' },
                                4: { type: 'string' },
                                6: { type: 'string' },
                                7: { type: 'string' },
                                8: { type: 'string' }
                            }
                        }
                    },
                    {
                        text: 'Refresh',
                        attr:  { id: 'btnRefresh' },
                        action: function (e, dt, node, config)
                        {
                            const btnRefresh = document.getElementById('btnRefresh');
                            btnRefresh.disabled = true;
                            btnRefresh.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Refreshing...';

                            displayToast('Data Refresh', 'Refreshing data from the server...');
                            dt.searchPanes.clearSelections();
                            
                            dt.ajax.reload(function()
                            {
                                // Rebuild search panes after reload but without losing current selections (true parameter)
                                setTimeout(() => dt.searchPanes.rebuildPane(undefined, true), 2000);

                                btnRefresh.disabled = false;
                                btnRefresh.innerHTML = 'Refresh';

                                displayToast('Data Refresh', 'Data refreshed successfully.');
                            }, false);
                        }
                    }
                ]
            },
            top1:
            {
                searchPanes:
                {
                    show: true,
                    initCollapsed: true,
                    cascadePanes: true
                }
            },
            topEnd: 'paging',
            bottomStart: null,
            bottomEnd: 'paging',
        }
    });

    // Periodic updates on the table querying the server every 5 minutes
    setInterval(function()
    {
        const btnRefresh = document.getElementById('btnRefresh');
        btnRefresh.disabled = true;
        btnRefresh.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Refreshing...';

        displayToast('Data Refresh', 'Refreshing data from the server...');
        
        tbl.ajax.reload(function()
        {
            // Rebuild search panes after reload but without losing current selections (true parameter)
            setTimeout(() => tbl.searchPanes.rebuildPane(undefined, true), 2000);

            btnRefresh.disabled = false;
            btnRefresh.innerHTML = 'Refresh';

            displayToast('Data Refresh', 'Data refreshed successfully.');

            // Keep current scroll position
            var scrollPos = $(window).scrollTop();
            $(window).scrollTop(scrollPos);
        }, false);
    }, 60000);
});
</script>
{% endblock %}
